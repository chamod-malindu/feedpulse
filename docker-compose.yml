version: '3.8'
services:

# MONGODB
  mongo:
    image: mongo:7
    container_name: feedpulse-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # Wait until MongoDB is ready before starting backend
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# BACKEND 
  backend:
    build:
      context: ./backend
    container_name: feedpulse-backend
    ports:
      - '4000:4000'
    environment:
      - MONGO_URI=mongodb://mongo:27017/feedpulse

      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - NODE_ENV=production
      - PORT=4000
    depends_on:
      mongo:
        # Check MongoDB healthcheck to pass before starting
        # Prevents backend from crashing on startup due to DB not being ready
        condition: service_healthy
    restart: unless-stopped

# FRONTEND 
  frontend:
    build:
      context: ./frontend
      args:
        # Build-time variable — baked into the Next.js bundle at build time
        # Must be set here because NEXT_PUBLIC_* vars are embedded during `next build`
        NEXT_PUBLIC_API_URL: http://localhost:4000/api
    container_name: feedpulse-frontend
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api
    depends_on:
      - backend
    restart: unless-stopped

# VOLUMES 
volumes:
  mongo_data:

